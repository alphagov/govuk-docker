volumes:
  public-asset-checker-tmp:

x-public-asset-checker: &public-asset-checker
  build:
    context: .
    dockerfile: Dockerfile.govuk-base
  image: public-asset-checker
  stdin_open: true
  tty: true
  volumes:
    - ${GOVUK_ROOT_DIR:-~/govuk}:/govuk:delegated
    - root-home:/root
    - public-asset-checker-tmp:/govuk/public-asset-checker/tmp
  working_dir: /govuk/public-asset-checker

services:
  public-asset-checker-lite: &public-asset-checker-lite
    <<: *public-asset-checker
    depends_on:
      - postgres-18
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres-18/public-asset-checker"
      TEST_DATABASE_URL: "postgresql://postgres:password@postgres-18/public-asset-checker-test"

  public-asset-checker-app: &public-asset-checker-app
    <<: *public-asset-checker
    depends_on:
      - nginx-proxy
      - postgres-18
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres-18/public-asset-checker"
      VIRTUAL_HOST: public-asset-checker.dev.gov.uk
      VIRTUAL_PORT: 3000
      BINDING: 0.0.0.0
      WEB_CONCURRENCY: 0
    expose:
      - "3000"
    ports:
      - "12350:12345"
    command: bin/rails s --restart
